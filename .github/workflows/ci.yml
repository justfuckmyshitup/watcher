name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Windows mock-mode checks
    runs-on: windows-latest
    env:
      LOCAL_SCRIBE_PROVIDER: mock
      LOCAL_SCRIBE_OCR_PROVIDER: mock
      LOCAL_SCRIBE_REQUIRE_GPU: "false"
      LOCAL_SCRIBE_OCR_REQUIRE_GPU: "false"
      LOCAL_SCRIBE_APP_DATA: app-data/ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r backend\requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run backend tests
        run: python -m pytest backend\tests

      - name: Build desktop frontend
        run: npm run build
